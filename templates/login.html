<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Educa+ Palmeira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --cor-principal: #F28C28;
            --cor-principal-hover: #D97D24;
        }
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            background-image: linear-gradient(to top right, #f8f9fa, #e9ecef);
        }
        .login-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.1);
        }
        .login-logo {
            max-width: 150px;
            margin-bottom: 1.5rem;
        }
        .btn-custom {
            background-color: var(--cor-principal);
            border-color: var(--cor-principal);
            color: white;
            padding: 0.75rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-custom:hover {
            background-color: var(--cor-principal-hover);
            border-color: var(--cor-principal-hover);
            color: white;
        }
        .input-group-text {
            background-color: #e9ecef;
            border-right: none;
        }
        .form-control {
            border-left: none;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 col-sm-8 col-11">
                <div class="card login-card">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="text-center">
                            <img src="https://palmeiradopiaui.pi.gov.br/uploads/clientes_imagem/70.png" alt="Logótipo da Prefeitura" class="login-logo">
                            <h3 class="mb-2">Educa+ Palmeira</h3>
                            <p class="text-muted mb-4">Acesso ao Sistema de Gestão Escolar</p>
                        </div>
                        
                        <!-- Bloco para exibir mensagens -->
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }} small" role="alert">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <!-- Formulário de Login -->
                        <form action="{{ url_for('login') }}" method="POST">
                            <div class="mb-3">
                                <label for="login" class="form-label small">Usuário, INEP ou CPF</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="login" name="login" required placeholder="Secretaria, INEP ou CPF do professor">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="senha" class="form-label small">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Deixe em branco no 1º acesso">
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-custom">Entrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
